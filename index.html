<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale = 1.0" />
        <title>Plant Bud</title>
    </head>
    <body>
        <!--Fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link 
            href="https://fonts.googleapis.com/css2?family=Pixelfy+Sans:wght@400..700&display=swap"
            rel="stylesheet"
        />
        <!--Style-->
        <link rel="stylesheet" href="style.css" />

        <!--App Content-->
        <div class="app" style="-webkit-app-region: drag;">
            <!--Title Bar-->
            <div class="title-bar">
                <!--Plant Name-->
                <h1 id="plant-name">Plant Name</h1>
                <div class="title-bar-btns">
                <!--Minimize button-->
                    <button class="title-bar-btn" id="minimize">
                        <img
                            id="minimize-btn"
                            alt="Minimize"
                            src="assets/title-bar-btns/minimize-btn.png"
                        />
                    </button>
                    <!--Close button-->
                    <button class="title-bar-btn" id="close">
                        <img
                            id="close-btn"
                            alt="Close"
                            src="assets/title-bar-btns/close-btn.png"
                        />
                    </button>
                </div>
                </div>
            </div>

        </div>

        <!--Script-->
        <script src="script.js"></script>
    </body>
</html>
